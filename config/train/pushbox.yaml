defaults:
  - launcher: local
  - data: pushbox
  - model: lewm
  - _self_

output_model_name: pushbox/lewm
subdir: pushbox-lewm
checkpoint_interval: 1

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  # There are 66,468 training clips after the deterministic episode-level
  # split. At batch size 128, 150 epochs gives about 78k optimizer steps.
  max_epochs: 150
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  multiprocessing_context: spawn

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# The local launcher defines the W&B destination.
wandb:
  enabled: true
