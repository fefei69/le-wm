defaults:
  - launcher: local
  - data: pushbox
  - model: lewm
  - _self_

output_model_name: pushbox_lewm
subdir: pushbox_lewm
checkpoint_interval: 10

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  # The local pilot has about 6.3k four-frame windows. At batch size 64,
  # 100 epochs gives roughly 8.8k optimizer steps.
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0

loader:
  # Batch size 64 was verified with a bf16 forward/backward pass on the local
  # 16 GB RTX 5080. Spawn avoids the installed Lance runtime's fork warning.
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  multiprocessing_context: spawn

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

# The local launcher defines the W&B destination.
wandb:
  enabled: true
