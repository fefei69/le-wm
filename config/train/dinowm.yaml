defaults:
  - launcher: local
  - _self_

hydra:
  job:
    chdir: false

output_model_name: pushbox/dinowm_dinov2s_prop_4h
subdir: pushbox-dinowm-dinov2s-prop-4h
dry_run: false
seed: 3072

# PushBox was recorded at 5 Hz. The nominal 4 h curve consumes every training
# episode remaining after the common held-out validation split (~3.7 h actual).
#
# Set curve.train_fraction to size the subset relative to the available
# training split instead (0.25/0.5/0.75/1.0); it takes precedence over
# train_hours. Both selectors share subset_seed, so subsets stay nested and
# match the LeWM runs episode for episode.
curve:
  label: 4h
  train_hours: 4.0
  train_fraction: null
  sample_hz: 5.0
  subset_seed: 8317
  # Give every fraction the same optimizer-step budget as the full split, so
  # the curve measures data volume rather than truncated training.
  match_optimizer_steps: false

dataset_name: ${oc.env:PUSHBOX_DATASET,pushbox_pilot_train.h5}
n_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
frameskip: 1
train_split: 0.9
split_search_trials: 50000

image_size: 224
patch_size: 14
batch_size: 32
num_workers: 16
prefetch_factor: 3

wm:
  history_size: 3
  num_preds: 1
  encoding:
    proprio: 10
    action: 10

# This is the published DINO-WM "small predictor" shape: DINOv2-small patch
# tokens plus a depth-6 causal transformer with 16 heads and a 2048-wide MLP.
predictor:
  size: small
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

model:
  _target_: stable_worldmodel.wm.PreJEPA
  history_size: ${wm.history_size}
  num_pred: ${wm.num_preds}
  interpolate_pos_encoding: true
  encoder:
    _target_: stable_worldmodel.wm.prejepa.module.create_backbone
    name: dinov2_small
  predictor:
    _target_: stable_worldmodel.wm.prejepa.module.CausalPredictor
    num_patches: ???
    num_frames: ${wm.history_size}
    dim: ???
    depth: ${predictor.depth}
    heads: ${predictor.heads}
    mlp_dim: ${predictor.mlp_dim}
    dim_head: ${predictor.dim_head}
    dropout: ${predictor.dropout}
    emb_dropout: ${predictor.emb_dropout}

optimizer:
  type: AdamW
  lr: 5e-4
  weight_decay: 0.0

checkpoint_interval: 5
trainer:
  max_epochs: 10
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 20

wandb:
  # Log to W&B so DINO-WM runs are comparable with the LeWM arms, which have
  # always logged there. The local CSV log is written either way, so disabling
  # this loses the W&B run but never the on-disk metrics.
  enabled: true
  config:
    entity: cw5167-nyu
    project: le-wm
    name: pushbox-dinowm-dinov2s-prop-${curve.label}
    id: ${subdir}
    group: pushbox-dinowm-learning-curves
    tags:
      - pushbox
      - dinowm
      - dinov2-small
      - proprio
      - ${curve.label}
    resume: allow
    log_model: false
